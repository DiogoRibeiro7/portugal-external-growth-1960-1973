name: Bug report
description: Report a reproducible problem in code, data processing, or validation.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      description: Include commands, inputs, and relevant file paths.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks Run
      description: Paste the relevant output from tests, validation, or pipeline commands.
