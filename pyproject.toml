[tool.poetry]
name = "portugal-external-growth"
version = "0.1.0"
description = "Reproducible data pipeline for Portuguese colonial and European economic linkages, 1960-1973."
authors = ["Diogo"]
readme = "README.md"
packages = [{ include = "portugal_external_growth", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = "^2.2.3"
requests = "^2.32.3"
pydantic = "^2.10.6"
pydantic-settings = "^2.7.1"
PyYAML = "^6.0.2"
typer = "^0.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
responses = "^0.25.3"
ruff = "^0.9.4"
mypy = "^1.14.1"
pandas-stubs = "^2.2.3.241126"
types-PyYAML = "^6.0.12.20241230"
types-requests = "^2.32.0.20241016"
pre-commit = "^4.1.0"

[tool.poetry.scripts]
peg = "portugal_external_growth.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["portugal_external_growth"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
