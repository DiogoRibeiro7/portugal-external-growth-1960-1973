[project]
name = "portugal-external-growth"
version = "0.1.6"
description = "Reproducible data pipeline for Portuguese colonial and European economic linkages, 1960-1973."
authors = [{ name = "Diogo Ribeiro", email = "diogo_dj@hotmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = [
  "portugal",
  "economic-history",
  "data-pipeline",
  "external-trade",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26.0,<2.4.0",
  "pandas>=2.2.3,<3.0.0",
  "requests>=2.32.3,<3.0.0",
  "pydantic>=2.10.6,<3.0.0",
  "pydantic-settings>=2.7.1,<3.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "typer>=0.15.1,<0.16.0",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/portugal-external-growth-1960-1973"
Repository = "https://github.com/DiogoRibeiro7/portugal-external-growth-1960-1973"
Documentation = "https://github.com/DiogoRibeiro7/portugal-external-growth-1960-1973#readme"
Issues = "https://github.com/DiogoRibeiro7/portugal-external-growth-1960-1973/issues"

[project.scripts]
peg = "portugal_external_growth.cli:app"

[tool.poetry]
packages = [{ include = "portugal_external_growth", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = "^6.0.0"
responses = "^0.25.3"
ruff = "^0.9.4"
mypy = "^1.14.1"
pandas-stubs = "^3.0.5.260730"
types-PyYAML = "^6.0.12.20241230"
types-requests = "^2.32.0.20241016"
pre-commit = "^4.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["portugal_external_growth"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 86
